# Configuration for rotation learning with GAT encoder
model:
  name: SiameseGAT
  embedding_size: 64
  # Rotation representation: "matrix" (9D) or "quaternion" (4D)
  rotation_representation: matrix

dataset:
  name: samples_v2_rot_only
  include_image_features: false

training:
  num_epochs: 100
  batch_size: 32
  lr: 0.001
  # Loss weighting
  lambda_translation: 1.0
  lambda_frobenius: 0.01
  # Rotation loss function: "l1", "mse", "frobenius", "quaternion"
  rotation_loss: l1
  # Whether to apply Frobenius norm regularization (only for matrix representation)
  use_frobenius_regularization: true
  scheduler:
    enabled: true
    step_size: 100
    gamma: 0.8

