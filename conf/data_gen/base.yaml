# Configuration for generate_data.py
# Override any value via CLI: uv run python generate_data.py num_samples=500

# Paths configuration
paths:
  # Path to COLMAP reconstruction model directory
  model: ./output/01_nerf/02_lego_large/1762043798762/0
  # Path to source images directory
  images: data/01_nerf/02_lego_large
  # Output directory for generated data
  output: data/samples_v1_trans_only

# Data generation parameters
generation:
  # Number of data samples to generate
  num_samples: 1000
  # Size of each image subset (nodes per graph)
  subset_size: 15
  # Random seed for reproducibility
  random_seed: 42

# Image feature parameters
features:
  # Whether to include image features in node features
  include_image_features: false
  # img_size not required when include_image_features is false

# Transformation parameters for pose augmentation
transform:
  # Range for random translations [min, max]
  translation_min: -3
  translation_max: 3
  # Whether to apply random rotation perturbation to poses_b
  enable_rotation_perturbation: false

