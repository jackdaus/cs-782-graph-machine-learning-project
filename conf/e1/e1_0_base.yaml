model:
  name: SiameseGCN
  embedding_size: 64
  # Rotation representation: "matrix" (9D) or "quaternion" (4D)
  rotation_representation: matrix

dataset:
  name: samples_v1_trans_only
  include_image_features: false

training:
  num_epochs: 1000
  batch_size: 64
  lr: 0.001
  lambda_translation: 1.0
  # Set to false to disable rotation loss (translation-only training)
  enable_rotation_loss: false
  scheduler:
    enabled: true
    step_size: 200
    gamma: 0.8
